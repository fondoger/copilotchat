name: Verify release publisher

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test publishing with isolated Git and GitHub fixtures
        shell: pwsh
        run: ./scripts/test-release.ps1
