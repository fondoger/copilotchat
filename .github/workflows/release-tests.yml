name: Verify release publisher

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test update signature and manifest verification
        run: go test ./scripts/verify-update -count=1
      - name: Check updater concurrency with the race detector
        run: go test -race ./internal/appupdate -count=1
      - name: Test publishing with isolated Git and GitHub fixtures
        shell: pwsh
        run: ./scripts/test-release.ps1
