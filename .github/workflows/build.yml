name: Build desktop packages

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: false
        default: ''
      release-tag:
        type: string
        required: false
        default: ''
      require-signed-updates:
        type: boolean
        required: false
        default: false
    secrets:
      updater-private-key:
        required: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: platforms
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          . ./scripts/release-common.ps1
          $version = if ($env:RELEASE_TAG) { Get-ReleaseVersion $env:RELEASE_TAG } else { (Get-ReleaseConfig).version }
          $matrix = @{ include = @(Get-ReleasePlatforms $version) } | ConvertTo-Json -Depth 5 -Compress
          "matrix=$matrix" >> $env:GITHUB_OUTPUT

  test:
    name: Test ${{ matrix.name }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        run: |
          . ./scripts/release-common.ps1
          Invoke-CheckedCommand -Command go -Arguments @('test', './...', '-count=1', '-timeout', '5m')
          Invoke-CheckedCommand -Command go -Arguments @('vet', './...')
          Invoke-CheckedCommand -Command go -Arguments @('tool', 'mygo', 'vet')

  package:
    name: Build ${{ matrix.name }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify runner architecture
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          $actual = "$(go env GOOS)/$(go env GOARCH)"
          if ($actual -cne $env:TARGET_PLATFORM) { throw "Expected native $env:TARGET_PLATFORM, got $actual." }
      - name: Package
        env:
          EXPECTED_TAG: ${{ inputs.release-tag }}
          REQUIRE_SIGNED_UPDATES: ${{ inputs.require-signed-updates }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ inputs.require-signed-updates && secrets.updater-private-key || '' }}
        run: |
          if ($env:REQUIRE_SIGNED_UPDATES -eq 'true') {
            ./scripts/package.ps1 -Platform '${{ matrix.platform }}' -ExpectedTag $env:EXPECTED_TAG -RequireSignedUpdates -SkipTests
          } else {
            ./scripts/package.ps1 -Platform '${{ matrix.platform }}' -ExpectedTag $env:EXPECTED_TAG -SkipTests
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.id }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
