name: CI

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'mygo.json'
      - 'Makefile'
      - 'internal/desktop/assets/**'
      - 'internal/desktop/web_chat.js'
      - 'internal/localproxy/codex/prompt.md'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tests:
    uses: ./.github/workflows/release-tests.yml

  build:
    uses: ./.github/workflows/build.yml
